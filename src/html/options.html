<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./icon.png" />
    <title>配置页面</title>
    <script src="./3.4.js"></script>
    <style>
      #dev-inject {
        display: none;
      }
      .-z-1 {
        z-index: -1;
      }

      .origin-0 {
        transform-origin: 0%;
      }

      input:focus ~ label,
      input:not(:placeholder-shown) ~ label {
        /* @apply transform; scale-75; -translate-y-6; */
        --tw-translate-x: 0;
        --tw-translate-y: 0;
        --tw-rotate: 0;
        --tw-skew-x: 0;
        --tw-skew-y: 0;
        transform: translateX(var(--tw-translate-x))
          translateY(var(--tw-translate-y)) rotate(var(--tw-rotate))
          skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y))
          scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
        --tw-scale-x: 0.75;
        --tw-scale-y: 0.75;
        --tw-translate-y: -1.5rem;
      }

      input:focus ~ label {
        /* @apply text-black; left-0; */
        --tw-text-opacity: 1;
        color: rgba(0, 0, 0, var(--tw-text-opacity));
        left: 0px;
      }
      .loader {
        width: 50px;
        aspect-ratio: 1;
        --c: no-repeat radial-gradient(farthest-side, #514b82 92%, #0000);
        background:
          var(--c) 50% 0,
          var(--c) 50% 100%,
          var(--c) 100% 50%,
          var(--c) 0 50%;
        background-size: 10px 10px;
        animation: l18 1s infinite;
        position: relative;
      }
      .loader::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: 3px;
        background: repeating-conic-gradient(#0000 0 35deg, #514b82 0 90deg);
        -webkit-mask: radial-gradient(
          farthest-side,
          #0000 calc(100% - 3px),
          #000 0
        );
        border-radius: 50%;
      }
      @keyframes l18 {
        100% {
          transform: rotate(0.5turn);
        }
      }
      
      /* 折叠样式 */
      .collapsible-header {
        cursor: pointer !important;
        user-select: none;
        display: flex !important;
        align-items: center;
        justify-content: space-between;
      }
      
      .collapsible-header:hover {
        background-color: rgba(0, 0, 0, 0.02);
      }
      
      .collapsible-arrow {
        transition: transform 0.3s ease;
        display: inline-block;
        font-size: 1rem;
        color: #6b7280;
        margin-left: 8px;
      }
      
      .collapsible-arrow.collapsed {
        transform: rotate(-90deg);
      }
      
      .collapsible-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
        opacity: 0;
      }
      
      .collapsible-content.expanded {
        max-height: 800px;
        opacity: 1;
        overflow: visible;
      }

      .github-org-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .github-org-row {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        background: #fafafa;
      }

      .github-org-row input[type="text"] {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-gray-100 p-0 sm:p-12">
      <div
        class="mx-auto max-w-md px-6 py-12 bg-white border-0 shadow-lg sm:rounded-3xl"
      >
        <h1 class="text-2xl font-bold mb-8">配置</h1>
        <form id="form" novalidate>
          <!-- GitHub 配置 -->
          <div class="mb-8">
            <div class="flex items-center justify-between border-b pb-2 mb-4">
              <h2 class="text-lg font-semibold text-gray-700">GitHub 增强</h2>
              <label class="inline-flex items-center gap-2 text-sm text-gray-600">
                <input id="github-enabled" type="checkbox" checked />
                启用
              </label>
            </div>
            <p class="text-xs text-gray-500 mb-4">
              按当前 GitHub 仓库所属 Org 加载对应的用户目录，可添加多个 Org。
            </p>
            <div id="github-orgs" class="github-org-list"></div>
            <button
              id="add-github-org"
              type="button"
              class="mt-4 px-4 py-2 text-sm text-blue-600 border border-blue-200 rounded-lg hover:bg-blue-50"
            >
              添加 GitHub Org
            </button>
            <div id="github-org-error" class="mt-3 text-sm text-red-600 hidden"></div>
          </div>

          <!-- 更多设置 -->
          <div class="mb-8">
            <div class="collapsible-header border-b pb-2 mb-4" id="more-settings-header">
              <h2 class="text-lg font-semibold text-gray-700">更多设置</h2>
              <span class="collapsible-arrow collapsed" id="more-settings-arrow">▼</span>
            </div>
            <div class="collapsible-content" id="more-settings-content">
              <h3 class="text-sm font-medium text-gray-500 mb-3">飞书关联</h3>
              <label class="inline-flex items-center gap-2 text-sm text-gray-600 mb-5">
                <input id="lark-enabled" type="checkbox" />
                启用飞书项目关联
              </label>
              <div class="relative z-0 w-full mb-5">
                <div>
                  <input
                    type="text"
                    name="app"
                    placeholder=" "
                    class="pt-3 pb-2 block w-full px-0 mt-0 bg-transparent border-0 border-b-2 appearance-none focus:outline-none focus:ring-0 focus:border-black border-gray-200"
                  />
                  <label
                    for="app"
                    class="absolute duration-300 top-3 -z-1 origin-0 text-gray-500"
                    >飞书命名空间</label
                  >
                </div>
                <p class="text-xs text-gray-500">
                  多个命名空间用逗号分隔。飞书关联关闭时不会影响 GitHub 核心功能。
                </p>
              </div>
              <div class="relative z-0 w-full mb-5">
                <div>
                  <input
                    type="text"
                    name="prefixes"
                    placeholder=" "
                    class="pt-3 pb-2 block w-full px-0 mt-0 bg-transparent border-0 border-b-2 appearance-none focus:outline-none focus:ring-0 focus:border-black border-gray-200"
                  />
                  <label
                    for="prefixes"
                    class="absolute duration-300 top-3 -z-1 origin-0 text-gray-500"
                    >项目编号前缀</label
                  >
                </div>
                <p class="text-xs text-gray-500">
                  仅用于飞书项目编号识别，如 XX、M、F。
                </p>
              </div>

              <h3 class="text-sm font-medium text-gray-500 mb-3">GitLab</h3>
              <div class="relative z-0 w-full mb-5">
                <div>
                  <input
                    type="text"
                    name="domain"
                    placeholder=" "
                    class="pt-3 pb-2 block w-full px-0 mt-0 bg-transparent border-0 border-b-2 appearance-none focus:outline-none focus:ring-0 focus:border-black border-gray-200"
                  />
                  <label
                    for="domain"
                    class="absolute duration-300 top-3 -z-1 origin-0 text-gray-500"
                    >GitLab 域名地址</label
                  >
                </div>
                <p class="text-xs text-gray-500">
                  多个域名用逗号分隔；GitHub 无需填写。
                </p>
              </div>

              <h3 class="text-sm font-medium text-gray-500 mb-3">Sentry</h3>
              <label class="inline-flex items-center gap-2 text-sm text-gray-600 mb-5">
                <input id="sentry-enabled" type="checkbox" />
                启用 Sentry 工单关联
              </label>
              <div class="relative z-0 w-full mb-5">
                <div>
                  <input
                    type="text"
                    name="sentryDomain"
                    placeholder=" "
                    class="pt-3 pb-2 block w-full px-0 mt-0 bg-transparent border-0 border-b-2 appearance-none focus:outline-none focus:ring-0 focus:border-black border-gray-200"
                  />
                  <label
                    for="sentryDomain"
                    class="absolute duration-300 top-3 -z-1 origin-0 text-gray-500"
                    >Sentry 域名地址</label
                  >
                </div>
                <p class="text-xs text-gray-500">
                  多个域名用逗号分隔。
                </p>
              </div>
              <div class="relative z-0 w-full mb-5">
                <div>
                  <input
                    type="text"
                    name="sentryIssueCreateUrl"
                    placeholder=" "
                    class="pt-3 pb-2 block w-full px-0 mt-0 bg-transparent border-0 border-b-2 appearance-none focus:outline-none focus:ring-0 focus:border-black border-gray-200"
                  />
                  <label
                    for="sentryIssueCreateUrl"
                    class="absolute duration-300 top-3 -z-1 origin-0 text-gray-500"
                    >Sentry Issue 创建地址</label
                  >
                </div>
                <p class="text-xs text-gray-500">
                  例如：http://localhost:8080/api/feishu-sentry
                </p>
              </div>
            </div>
          </div>
          <div
            class="relative z-0 w-full mb-5 text-sm text-red-600 hidden"
            id="error"
          ></div>
          <div
            class="relative z-0 w-full mb-5 text-sm text-green-600 hidden"
            id="success"
          >
            配置成功
          </div>
          <button
            id="button"
            type="button"
            class="w-full px-6 py-3 mt-3 text-lg text-white transition-all duration-150 ease-linear rounded-lg shadow outline-none bg-pink-500 hover:bg-pink-600 hover:shadow-lg focus:outline-none"
          >
            提交
          </button>
          <div class="text-center mt-5" id="dev-inject">
            <button
              id="dev-inject-btn"
              type="button"
              class="text-blue-500 hover:text-blue-700 underline cursor-pointer bg-transparent border-0 p-0"
              >dev inject script</button
            >
          </div>
        </form>
      </div>
    </div>
    <!-- loading -->
    <div id="loading" class="hidden">
      <div
        class="fixed inset-0 z-50 bg-black opacity-30 flex items-center justify-center flex-1"
      >
        <div class="loader">更新中...</div>
      </div>
    </div>
    <script src="./options.js"></script>
  </body>
</html>
